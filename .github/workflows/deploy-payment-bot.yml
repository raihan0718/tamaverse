name: Deploy Tamaverse Payment Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/tamaverse-payment-bot/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-payment-bot.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy payment bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy tamaverse-payment-bot --project-ref uziyhbgxvdetzlujzozu --no-verify-jwt
