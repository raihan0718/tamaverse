name: Deploy Tamaverse Main Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/tamaverse-main-bot/**"
      - "supabase/functions/telegram-auth/**"
      - "supabase/functions/grant-founder-rewards/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-main-bot.yml"

concurrency:
  group: deploy-tamaverse-main-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.20.12

      - name: Deploy Telegram auto-auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy telegram-auth --project-ref uziyhbgxvdetzlujzozu --no-verify-jwt

      - name: Deploy founder rewards verifier
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy grant-founder-rewards --project-ref uziyhbgxvdetzlujzozu --no-verify-jwt

      - name: Deploy Tamaverse main bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy tamaverse-main-bot --project-ref uziyhbgxvdetzlujzozu --no-verify-jwt
