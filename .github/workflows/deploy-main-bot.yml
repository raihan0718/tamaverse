name: Deploy Tamaverse Main Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/tamaverse-main-bot/**"
      - "supabase/functions/telegram-auth/**"
      - "supabase/functions/grant-founder-rewards/**"
      - "supabase/functions/tamaverse-pet-care-notifications/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-main-bot.yml"
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: deploy-tamaverse-main-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.20.12

      - name: Deploy Telegram auto-auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy telegram-auth --project-ref uziyhbgxvdetzlujzozu --no-verify-jwt

      - name: Deploy founder rewards verifier
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy grant-founder-rewards --project-ref uziyhbgxvdetzlujzozu --no-verify-jwt

      - name: Deploy Tamaverse main bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy tamaverse-main-bot --project-ref uziyhbgxvdetzlujzozu --no-verify-jwt

      - name: Deploy pet-care notification sender
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy tamaverse-pet-care-notifications --project-ref uziyhbgxvdetzlujzozu --no-verify-jwt

  notify:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send due pet-care notifications
        env:
          NOTIFICATION_SECRET: ${{ secrets.TAMAVERSE_NOTIFICATION_CRON_SECRET }}
        run: |
          if [ -z "$NOTIFICATION_SECRET" ]; then
            echo "Missing GitHub Actions secret: TAMAVERSE_NOTIFICATION_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://uziyhbgxvdetzlujzozu.supabase.co/functions/v1/tamaverse-pet-care-notifications" \
            -H "x-tamaverse-cron-secret: $NOTIFICATION_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
